spring.application.name=resume-interview

# 从仓库根目录的 .env 注入环境变量（本地密钥不入库）
spring.config.import=optional:file:../.env[.properties]

server.port=8080

# ---- JWT 鉴权密钥（HS256，≥32 字节；demo 用随机值，生产应从 .env 注入）----
auth.jwt-secret=${JWT_SECRET:dev-only-insecure-change-me-0123456789abcdef}

# ---- DeepSeek（Spring AI 官方 starter；属性前缀 spring.ai.deepseek.*，2.0.1 实测）----
spring.ai.deepseek.api-key=${DEEPSEEK_API_KEY}
spring.ai.deepseek.base-url=${DEEPSEEK_BASE_URL}
spring.ai.deepseek.chat.options.model=${DEEPSEEK_MODEL:deepseek-chat}
# 抽取/判分/出题需要稳定输出，温度置 0 降低随机性
spring.ai.deepseek.chat.options.temperature=0

# ---- LLM 调用重试（网络抖动/限流自动重试，避免一次失败就置 FAILED）----
spring.ai.retry.max-attempts=3
spring.ai.retry.backoff.initial-interval=2000
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.backoff.max-interval=20000

# ---- 图形验证码（登录/注册）----
auth.captcha.enabled=${CAPTCHA_ENABLED:true}

# ---- 微信小程序静默登录（appid 已开通；secret 为小程序密钥，仅服务端，从 .env 注入）----
wechat.miniapp.appid=${WECHAT_MINIAPP_APPID:wx20139b3693e6c162}
wechat.miniapp.secret=${WECHAT_MINIAPP_SECRET:}

# ---- 文件上传（简历 PDF/Word/图片）----
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---- 智谱 OCR 不走 Spring AI，由 ZhipuOcrClient 直调 HTTP ----
zhipu.api-key=${ZHIPU_API_KEY}
zhipu.ocr-model=${ZHIPU_OCR_MODEL:glm-ocr}
zhipu.base-url=${ZHIPU_BASE_URL:https://open.bigmodel.cn/api/paas/v4}

# ---- SQLite 数据源（本地文件，位于仓库根 data/ 目录；WAL 模式：读写不互斥 + busy_timeout 排队）----
spring.datasource.url=jdbc:sqlite:file:../data/resume-interview.db?journal_mode=WAL&busy_timeout=5000
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite 为一写多读，连接池放开读并发；写操作串行 + busy_timeout 排队兜底
spring.datasource.hikari.maximum-pool-size=3
# ---- 阿里百炼（RAG 向量化，embedding 语义召回）----
dashscope.api-key=${DASHSCOPE_API_KEY}
dashscope.embedding-model=${DASHSCOPE_EMBEDDING_MODEL:qwen3.7-text-embedding}
dashscope.base-url=${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/api/v1/services/embeddings/text-embedding}

# ---- ReRank（阿里 MaaS 专属端点，qwen3.7-text-rerank）----
rerank.base-url=${RERANK_BASE_URL}
rerank.model=qwen3.7-text-rerank
rerank.api-key=${DASHSCOPE_API_KEY}
